[package]
name = "crdtdb"
version = "0.1.0"
edition = "2021"
description = "A CRDT-native distributed relational database engine"
license = "MIT"
repository = "https://github.com/crdtdb/crdtdb"

[[bin]]
name = "crdtdb-daemon"
path = "src/bin/daemon.rs"

[[bin]]
name = "dashboard-server"
path = "src/bin/dashboard_server.rs"

[[example]]
name = "demo"
path = "examples/demo.rs"

[[bench]]
name = "engine_bench"
harness = false

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

# Hashing
blake3 = "1"

# SQL parsing
sqlparser = "0.44"

# HTTP daemon
axum = { version = "0.7", features = ["json", "ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }
futures = "0.3"

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
hex = "0.4"
indexmap = { version = "2", features = ["serde"] }
parking_lot = "0.12"

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
tokio = { version = "1", features = ["test-util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.bench]
opt-level = 3
