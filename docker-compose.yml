version: "3.9"

services:
  peer_a:
    build: .
    environment:
      - PEER_ID=peer_a
      - BIND_ADDR=0.0.0.0:8080
      - DB_PATH=/data
    volumes:
      - peer_a_data:/data
    ports:
      - "8080:8080"

  peer_b:
    build: .
    environment:
      - PEER_ID=peer_b
      - BIND_ADDR=0.0.0.0:8080
      - DB_PATH=/data
    volumes:
      - peer_b_data:/data
    ports:
      - "8081:8080"

  peer_c:
    build: .
    environment:
      - PEER_ID=peer_c
      - BIND_ADDR=0.0.0.0:8080
      - DB_PATH=/data
    volumes:
      - peer_c_data:/data
    ports:
      - "8082:8080"

volumes:
  peer_a_data:
  peer_b_data:
  peer_c_data:
